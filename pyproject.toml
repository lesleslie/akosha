[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akosha"
version = "0.27.0"
description = "Universal Memory Aggregation System - Cross-system intelligence for Session-Buddy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx2>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "duckdb>=2.0.0.dev0",
    "oneiric>=0.33",
    "typer>=0.12.0",  # CLI framework
    "uvicorn[standard]>=0.30.0",
    "redis>=5.0.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-proto>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.0.0",
    "opentelemetry-instrumentation-asyncio>=0.0.0",
    "opentelemetry-exporter-otlp>=1.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-prometheus>=0.40b0,<1.0.0",
    "prometheus-client>=0.20.0",
    "numpy>=2.0.0",
    "tenacity>=9.0.0",
    "fastmcp>=4.0.0,<5",
    "circuitbreaker>=2.0.0",
    "pybreaker>=1.0.0",
    "pyjwt>=2.9.0",  # JWT authentication support
    "cryptography>=50.0.0",  # ed25519 signing for skill/agent distribution (Phase 1.5)
    "pyarrow>=16.0.0",
    "aiohttp>=3.12.14",  # audit C5: imported in akosha/api/middleware.py:116
    "datasketch>=0.6.0",  # audit H2: MinHash for fuzzy deduplication
    # 0.18.0+ required for `apply_tool_profile()` (ToolProfile dispatch
    # helper) — Phase 10 task 4 schema extension.
    # 0.33.1 is the floor for the producer-telemetry OWNERSHIP API.
    # `configure_producer_tracing` used to return a bool that meant "we
    # installed the provider" in one branch and "someone else installed
    # it and we declined" in another, so a caller could not tell whether
    # it was allowed to close the provider. 0.33.1 returns
    # `ProducerTracingResult`, which keeps the export decision and the
    # ownership question as separate facts. The launcher installs the
    # provider BEFORE the server is built, so akosha inherits one it does
    # not own — the ownership distinction is what keeps a component from
    # closing an exporter that belongs to someone else.
    "mcp-common>=0.33.1",
]

[project.scripts]
akosha = "akosha.cli:app"

[project.entry-points."bodai.apps"]
akosha = "akosha.cli:app"

[project.license]
text = "BSD-3-CLAUSE"

[tool.uv]
# Aligns akosha with the DuckDB oneiric resolves (oneiric/uv.lock -> 2.0.0.dev*).
#
# The `duckdb` library is resolved by the importing process, not by the repo
# that owns the DDL: oneiric owns spans_substrate, akosha opens it. With no
# prerelease setting here, akosha resolved the latest STABLE (1.5.6) while
# oneiric ran a 2.0.0 dev build -- so shared substrate code behaved
# differently depending on which repo called it. The skew is silent rather
# than loud: `result.rowcount` returns the affected count on 2.x and -1 on
# 1.5.6, and -1 is a number, so nothing raises.
prerelease = "allow"

# The repo-wide `prerelease = "allow"` above exists for duckdb, not for
# every package: it lets akosha track the same 2.1.0.dev* build oneiric
# resolves, so the shared substrate behaves identically in both repos.
#
# It also lets uv adopt a redis PRE-RELEASE, and that is how redis
# 8.2.0b1 reached this repo and turned seven tests in
# tests/unit/ingestion/test_bodai_event_subscriber.py red. redis 8.2.0b1
# changed `deprecated_args` to close over the builtin
# `dict_keys.isdisjoint` method descriptor, and fakeredis discovers
# deprecated arguments by walking that closure -- dereferencing
# `method.__closure__` on every callable it finds, which raises
# AttributeError on a method descriptor. fakeredis 2.40.0 is the newest
# release, so the guard has to land upstream.
#
# The 7-day cooldown below already excludes a beta published in the last
# week, but it is a ROLLING window: once the beta is more than 7 days old
# and no stable release has superseded it, a routine `uv lock` would
# adopt it again. This targeted policy is the only thing that says "redis
# takes no pre-releases, ever" -- duckdb keeps the repo-wide allowance.
#
# Drop this override once fakeredis ships the fix:
# https://github.com/cunla/fakeredis-py/issues
prerelease-package = { redis = "disallow" }

# 7-day dependency cooldown. A package published minutes ago has had no
# time to be flagged, and a rolling window keeps a fresh compromise from
# being adopted by a routine `uv lock`. This is the fleet standard --
# crackerjack/pyproject.toml carries the same setting with the same
# carve-out classes (see below).
exclude-newer = "7 days"

# Carve-outs from the cooldown. Far-future timestamps disable the window
# for that package only. Three classes, mirroring crackerjack:
#
#   1. Bodai ecosystem -- we want same-day access to ecosystem releases
#      so cross-repo changes can be validated immediately.
#   2. CVE fixes -- a security-fix release that lands inside the window
#      must be adoptable immediately; without the override `uv lock
#      --upgrade` silently keeps the vulnerable version.
#   3. Dev-tool pinning -- the tool's version CHANGES WHAT THE GATE
#      REPORTS, so a week-old version is a degraded signal, not a
#      security posture.
[tool.uv.exclude-newer-package]
# Class 1 -- Bodai ecosystem. Every Bodai package akosha resolves from
# the registry (akosha itself is this repo's editable root, so the
# cooldown does not apply to it).
crackerjack = "2099-12-31T23:59:59Z"
mcp-common = "2099-12-31T23:59:59Z"
oneiric = "2099-12-31T23:59:59Z"
session-buddy = "2099-12-31T23:59:59Z"
# Class 2 -- CVE fixes. Same fleet-wide set crackerjack carries: uv's
# vendored webpki-root-certs (PYSEC-2026-4321), certifi
# (PYSEC-2026-4320), filelock (CVE-2026-112907/112913/112940),
# fastmcp + fastmcp-slim (GHSA-7xgj-8392-5q4r and
# GHSA-vqqp-x5qm-5qp4, authorization bypasses in the MCP server), and
# pyasn1 (four quadratic-complexity DoS bugs in the ASN.1 decoder).
# Each fix landed inside a cooldown window, so without these entries the
# resolver keeps the vulnerable version rather than erroring.
certifi = "2099-12-31T23:59:59Z"
fastmcp = "2099-12-31T23:59:59Z"
fastmcp-slim = "2099-12-31T23:59:59Z"
filelock = "2099-12-31T23:59:59Z"
pyasn1 = "2099-12-31T23:59:59Z"
uv = "2099-12-31T23:59:59Z"
# Class 3 -- dev-tool pinning. ty is the gate's primary type checker
# and ruff is its linter; their versions change what the gate reports,
# so a week-old ty or ruff fails quietly rather than loudly. Both arrive
# transitively through crackerjack.
ruff = "2099-12-31T23:59:59Z"
ty = "2099-12-31T23:59:59Z"
pytest-testmon = "2099-12-31T23:59:59Z"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "scripts/**",  # Utility scripts
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "UP007",  # Optional[X] -> X | None (not ready for Python 3.13)
    "RUF012", # Mutable class attributes (too strict)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001"]  # Allow unused arguments in tests
"akosha/**/*cli*.py" = ["B008"]  # Typer idiom: typer.Option(...) in default args
"akosha/cli/**/*.py" = ["B008"]  # Typer idiom: typer.Option(...) in default args

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=akosha",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=89.0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance benchmarks",
    "stress: marks tests as stress tests",
    "flaky: marks tests as flaky (may fail intermittently)",
    "network: marks tests that require network access",
    "expensive: marks tests that are expensive to run (compute/time)",
    "security: marks tests that verify security properties",
    "maintenance: marks tests for maintenance tasks",
    "req: Traceable spec REQ ID (D2 wire-up discipline; see crackerjack-compliant-code skill)",
]

[tool.coverage.run]
source = ["akosha"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
fail_under = 87.61723329425557

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUntypedFunctionDecorator = "none"  # traced decorator is well-typed but pyright can't infer complex async/sync patterns

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]  # Allow assert statements in code


[tool.refurb]
python_version = "3.14"


[tool.creosote]
exclude_deps = [
    "tenacity",
    "structlog",
    "circuitbreaker",
    "pybreaker",
    "pydantic-settings",
]


[tool.hatch.build.targets.wheel]
packages = ["akosha"]

[tool.ty]
src = { include = ["akosha/**/*.py"] }

[tool.ty.rules]
# Same `# ty: ignore` directive can report UNUSED in interactive shell but
# suppress a real error under crackerjack (stricter ty config). Treat
# unused-ignore as informational only so directives work in both contexts.
unused-ignore-comment = "ignore"

# PEP 735 dependency-groups (replaces [project.optional-dependencies]).
# Install with: uv sync --group dev --group vector-pg
# Dev workflow and feature groups for local development and optional features.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "bandit>=1.7.0",
    "refurb>=0.0.0",
    "pyright>=1.1.0",
    "crackerjack>=0.89.2",
    "session-buddy>=0.18.0",
    "fakeredis>=2.20.0",  # fakeredis.aioredis for tests/unit/ingestion/test_bodai_event_subscriber.py
]

# vector-pg group: pgvector backend for HotStore.
# Production deployments using `backend: pgvector` need asyncpg + pgvector
# at runtime; the dev group pulls them in for tests too so the
# `tests/integration/test_pgvector_hot_store_e2e.py` canary activates.
vector-pg = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
]
