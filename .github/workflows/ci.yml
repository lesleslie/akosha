name: AkoSHA CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgvector-e2e:
    name: pgvector (${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: akosha
          POSTGRES_PASSWORD: akosha
          POSTGRES_DB: akosha_pgvector
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install pgvector + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-server-dev-${{ matrix.postgres-version }} gcc
          git clone --depth 1 --branch v0.7.4 https://github.com/pgvector/pgvector.git /tmp/pgvector
          cd /tmp/pgvector && make && sudo make install
          cd ${{ github.workspace }}
          uv sync --all-extras --group storage-pg

      - name: Create vector extension
        env:
          PGPASSWORD: akosha
        run: |
          psql -h localhost -U akosha -d akosha_pgvector -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pgvector hot-store e2e
        env:
          AKOSHA_TEST_PGVECTOR_URL: postgresql://akosha:akosha@localhost:5432/akosha_pgvector
          AKOSHA__STORAGE__HOT__BACKEND: pgvector
          AKOSHA__STORAGE__HOT__PG_URL: postgresql://akosha:akosha@localhost:5432/akosha_pgvector
        run: |
          uv run pytest tests/integration/test_pgvector_hot_store_e2e.py -v --no-cov