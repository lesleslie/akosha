# Akosha Server Configuration
# Oneiric pattern: layered loading (defaults -> YAML -> env vars)

server_name: "Akosha Seer"
server_description: "Cross-system intelligence and embeddings for the Bodai ecosystem"

# Operational mode (lite, standard)
mode: lite

# Storage configurations
hot:
  backend: duckdb-memory
  path: ":memory:"
  write_ahead_log: true

warm:
  backend: duckdb-ssd
  num_partitions: 256

cold:
  backend: local
  bucket: akosha-cold-data
  prefix: conversations/
  format: parquet
  region: us-west-2

cache:
  backend: redis
  host: localhost
  port: 6379
  db: 0
  local_ttl_seconds: 60
  redis_ttl_seconds: 3600

# API configuration
api_port: 8682
mcp_port: 3002
debug: false

# Processing configuration
ingestion_workers: 3
max_concurrent_ingests: 100
shard_count: 256

# Monitoring configuration
metrics_enabled: true
prometheus_port: 9090

# Environment
environment: development

# EventBridge publisher (Phase 6 cross-repo publisher).
# When enabled=true and dry_run=false, Akosha emits analytics events
# (pattern.detected, anomaly.detected, insight.generated,
# aggregation.completed) to the unified Bodai EventBridge stream
# consumed by Mahavishnu's Bodai subscriber.
# Default disabled (enabled=false, dry_run=true) per operator-facing
# toggle convention.
eventbridge:
  enabled: false
  default_topic: "analytics.default"
  default_source: "akosha"
  endpoint: null  # Reserved for future AWS PutEvents integration
  max_concurrency: 5
  timeout_seconds: 5.0
  dry_run: true

# Hot store (DuckDB-backed) for vector search across indexed system
# memories. Used by mcp__akosha__search_all_systems to serve real
# results instead of mock data. In-memory by default; set
# database_path to a file path for persistence across restarts.
# Plan: docs/plans/2026-08-29-akosha-websocket-search.md Sub-plan A.
hot_store:
  enabled: true
  # Backend selector. One of:
  #   duckdb-memory   in-memory DuckDB (default; lost on restart)
  #   pgvector        Postgres + pgvector extension (production)
  # Plan: docs/plans/2026-08-29-pgvector-default.md Phase 1.
  backend: duckdb-memory
  database_path: ":memory:"
  retention_minutes: 60
  # Embedding vector dim baked into the DuckDB FLOAT[N] schema at
  # startup. 384 is the historical mock fallback (matches the
  # all-MiniLM-L6-v2 shape); production deployments should override
  # this to match the active embedding backend's dim (e.g. 768 for
  # llama_cpp / ollama, 1024 for MiniMax). When unset, the runtime
  # resolves via ``akosha.processing.embedding_dim.resolve_embedding_dim``.
  # Plan: docs/plans/2026-08-29-embedding-dim-fix.md Phase 4.
  embedding_dimension: 384  # auto-detected at runtime; override to pin
  # Required when backend=pgvector. Format: postgresql://user@host:port/db.
  # The pgvector extension must be installed (``CREATE EXTENSION vector;``)
  # before the application starts; otherwise PgvectorAdapter.init() fails.
  pg_url: ""
  # Collection name inside the pgvector database. Defaults to
  # "akosha_conversations" which matches PgvectorHotStore's internal
  # collection constant. Operators typically don't need to change this.
  pg_collection: "akosha_conversations"

# WebSocket invocations subscriber (Dhara -> HotStore).
# Populated when websocket_invocations_subscriber.enabled is true.
# Sub-plan B wiring lives in akosha/ingestion/websocket_invocations_subscriber.py.
websocket_invocations_subscriber:
  enabled: false  # default off; flip to true to activate
  poll_interval_seconds: 5

# Redis-Streams push subscriber (bodai:events -> HotStore).
# Replaces the Dhara poll loop with a Redis subscription when both
# this block is enabled AND Mahavishnu's producer (Phase 1 of
# docs/plans/2026-08-29-push-subscriber.md, commit 7b2c498c) is
# running with ``MAHAVISHNU_EVENTS_REDIS_URL`` set. When Redis is
# unreachable the subscriber fails soft to the Dhara poll loop;
# no envelopes are lost because the poll loop remains the source
# of truth until the operator flips ``enabled: true`` here.
# Plan: docs/plans/2026-08-29-push-subscriber.md Phase 4.
bodai_tool_invocation_subscriber:
  enabled: false  # opt-in; flip to true after Mahavishnu Phase 1 is on main
  redis_url: "redis://localhost:6379/0"
  consumer_group: "akosha-tool-invocation-indexers"
  xreadgroup_block_ms: 1500
  per_event_timeout_seconds: 30.0
