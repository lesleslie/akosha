# Akosha Server Configuration
# Oneiric pattern: layered loading (defaults -> YAML -> env vars)

server_name: "Akosha Seer"
server_description: "Cross-system intelligence and embeddings for the Bodai ecosystem"

# Operational mode (lite, standard)
mode: standard

# Storage configurations
# 2026-09-27 audit: pgvector migrated from hot tier to warm tier. The
# DuckDB store is the only hot-tier backend. Set warm.backend
# to "pgvector" and supply warm.pg_url to opt in to the pgvector warm
# store (one collection per shard). See akosha/storage/pgvector_warm_store.py.
#
# DURABILITY (2026-11-05): the hot tier used to be `duckdb-memory` /
# `:memory:`, which loses EVERY row on restart. That is what made the
# knowledge graph permanently empty: the `conversations` table (the graph's
# only source of rows) was wiped on every restart, and the in-memory graph
# was rebuilt from an empty table.
#
# `duckdb-ssd` is the durable DuckDB variant the substrate already
# supports. `path` is RELATIVE to the resolved storage base directory
# (the XDG data dir, e.g. ~/Library/Application Support/akosha on macOS),
# so the setting is portable across machines. An absolute path is used
# as-is; `:memory:` still means "ephemeral".
hot:
  backend: duckdb-ssd
  path: "hot/hot.db"
  write_ahead_log: true

warm:
  backend: duckdb-ssd   # options: duckdb-ssd, duckdb-hdd, pgvector
  num_partitions: 256
  pg_url: ""            # required when warm.backend="pgvector"; e.g. postgresql://user@host:5432/akosha

# Cold storage — backend/bucket/prefix/compression are substrate-mapped
# (per akosha/config.py:_SUBSTRATE_MAPPED_NESTED). The committed substrate
# default is `cold.backend="r2"`, but `cold_store.py` only supports
# [local, s3, gcs, azure]; prod must override to "s3" via
# ONEIRIC__SUBSTRATE__COLD__BACKEND. See docs/operators/cold-tier-quickstart.md
# §"Cloudflare R2" for the full walkthrough.
#
# Non-substrate fields you can set in settings/local.yaml:
#   cold.endpoint_url — override API endpoint (fake-gcs / R2)
#   cold.project — GCP project ID (gcs backend only; ignored on s3)
#   cold.anonymous_credentials — use anonymous GCS creds (fake-gcs only)
#   cold.access_key_id / cold.secret_access_key — S3 credentials (R2 etc.)
#   cold.region — S3 region ("auto" for R2; real region for AWS S3)
#   cold.format — file format (parquet)
#   cold.age_threshold_days — age at which a warm record ages out to cold
#     (default 90, the documented cold-tier boundary). NOT substrate-mapped:
#     it is an Akosha-local policy, so this line DOES take effect.
#
# The component-scoped env vars (AKOSHA__STORAGE__COLD__*) are the TOP
# layer of the config stack: one set in the environment overrides the
# value below. Same for the flat legacy forms (AKOSHA_COLD_ENDPOINT,
# AKOSHA_COLD_REGION), which apply only when their nested counterpart
# is unset.
cold:
  # `backend`, `bucket`, `prefix` and `compression` are SUBSTRATE-mapped:
  # akosha/config.py:_strip_substrate_mapped removes them from the YAML
  # before the config is built, so the lines below have NO runtime
  # effect. Their values come from the substrate:
  #   ONEIRIC__SUBSTRATE__COLD__BACKEND / _BUCKET / _PREFIX / _COMPRESSION
  # or, for Akosha specifically, the component-scoped overrides:
  #   AKOSHA__STORAGE__COLD__BACKEND / _BUCKET
  # Keep the lines below for documentation only; do not rely on them.
  backend: local
  bucket: akosha-cold         # canonical cold-store bucket name for akosha
  prefix: conversations/
  format: parquet
  # Warm-tier age at which a record is exported to the cold tier.
  # 90 days matches the documented cold tier ("Cold Tier (90+ days)").
  # Overridable per deployment via AKOSHA__STORAGE__COLD__AGE_THRESHOLD_DAYS.
  age_threshold_days: 90
  # region intentionally omitted so per-deployment values from
  # ~/.config/akosha/local.yaml or AKOSHA_COLD_REGION win cleanly.
  # R2 needs "auto", AWS S3 needs a real region (e.g. us-west-2),
  # GCS ignores the field. The code default is "auto" (R2's default
  # backend is R2).

cache:
  backend: redis
  host: localhost
  port: 6379
  db: 0
  local_ttl_seconds: 60
  redis_ttl_seconds: 3600

# API configuration
# Both API (HTTP/FastMCP) and MCP listen on 8682 (Bodai port convention).
# See akosha/config.py:DEFAULT_MCP_PORT for the source-of-truth comment.
api_port: 8682
mcp_port: 8682
debug: false

# Processing configuration
ingestion_workers: 3
max_concurrent_ingests: 100
shard_count: 256

# Monitoring configuration
metrics_enabled: true
prometheus_port: 9090

# Environment
environment: development

# EventBridge publisher (Phase 6 cross-repo publisher).
# When enabled=true and dry_run=false, Akosha emits analytics events
# (pattern.detected, anomaly.detected, insight.generated,
# aggregation.completed) to the unified Bodai EventBridge stream
# consumed by Mahavishnu's Bodai subscriber.
# Default disabled (enabled=false, dry_run=true) per operator-facing
# toggle convention.
eventbridge:
  enabled: false
  default_topic: "analytics.default"
  default_source: "akosha"
  endpoint: null  # Reserved for future AWS PutEvents integration
  max_concurrency: 5
  timeout_seconds: 5.0
  dry_run: true

# 2026-09-27 cleanup: removed the orphan `hot_store:` block. It was a legacy
# duplicate that wasn't bound to any AkoshaConfig field — the Oneiric
# loader's field filter (akosha/config.py:423-431) silently dropped it.
# Its intended values (`backend`, `database_path`) are now read from the
# real `hot:` block above (HotStorageConfig, bound to
# akosha.storage.create_hot_store()). The `pg_url` field was removed
# from the hot tier entirely (pgvector migrated to warm — see the
# comment above the `warm:` block). Aspiration-only values
# (`retention_minutes`, `embedding_dimension`, `pg_collection`) belong
# at the consumer call site — `embedding_dimension` is auto-resolved at
# runtime by `akosha/processing/embedding_dim.py:resolve_embedding_dim()`.
# See akosha/AKOSHA_ARCHITECTURE_AUDIT_2026-09-09.md §"hot_store:" for
# the full drift history.

# WebSocket invocations subscriber (Redis Streams -> HotStore).
# Populated when websocket_invocations_subscriber.enabled is true.
# Sub-plan B wiring lives in akosha/ingestion/websocket_invocations_subscriber.py.
websocket_invocations_subscriber:
  enabled: false  # default off; flip to true to activate
  poll_interval_seconds: 5

# Redis-Streams push subscriber (bodai:events -> HotStore).
# The Redis subscription is the sole ingestion path when both
# this block is enabled AND Mahavishnu's producer (Phase 1 of
# docs/plans/2026-08-29-push-subscriber.md, commit 7b2c498c) is
# running with ``MAHAVISHNU_EVENTS_REDIS_URL`` set. When Redis is
# unreachable the subscriber fails soft and stays not-running; the
# historical poll fallback was removed in 2026-09-26.
# Plan: docs/plans/2026-08-29-push-subscriber.md Phase 4.
bodai_tool_invocation_subscriber:
  enabled: false  # opt-in; flip to true after Mahavishnu Phase 1 is on main
  redis_url: "redis://localhost:6379/0"
  consumer_group: "akosha-tool-invocation-indexers"
  xreadgroup_block_ms: 1500
  per_event_timeout_seconds: 30.0

# v7 PR-A3: OTel span substrate + receiver.
#
# The receiver OWNS the canonical OTLP ports. Grafana Alloy moves to
# :14317/:14318 at cutover per
# docs/decisions/2026-10-21-otel-substrate-port-ownership.md.
#
# These keys must be declared on AkoshaConfig.spans_substrate to take effect:
# get_config strips any key not declared there, and does so silently — an
# undeclared key is dropped with nothing in the logs, so the receiver binds
# the defaults while the operator believes otherwise.
spans_substrate:
  receiver_grpc_port: 4317
  receiver_http_port: 4318
  retention_days: 30
  # PR-A3 ships the lifespan task; PR-A4 lands the sweep body. Until then
  # the task runs and does nothing, and the retention runbook's
  # "sweep never started" alert correctly does not fire.
  retention_sweep_interval_hours: 6

# OTLP receiver tooling (v7 §11.4 / §13.6).
#
# These keys must be declared on AkoshaConfig.otel to take effect: get_config
# strips any key not declared there, and does so silently.
otel:
  receiver:
    # PR-A8 sets this to false. The legacy OtelTraceIngester POSTs an empty
    # JSON envelope to an OTLP/HTTP endpoint every 60s; no standard receiver
    # answers that, so it has ingested nothing since the OTLP receiver took
    # :4318. Rollback is setting this back to true and restarting -- never a
    # code revert. The class is kept behind the flag precisely so that stays
    # true.
    trace_ingester_poller: false

    # Static roster of MCP servers expected to be producing spans. An EMPTY
    # roster is itself a P0: the heartbeat watcher would have nothing to
    # check, which is a misconfiguration rather than an all-clear.
    known_mcp_servers:
      - "mahavishnu"
      - "akosha"
      - "session-buddy"
      - "oneiric"
      - "crackerjack"
